# ============================================================================
# Robustness scenarios of the revision (layer2_economics/R/18_revision_scenarios.R)
# ============================================================================
# Each scenario changes ONE modeling choice that favors cycle compression, or the prior on
# compression itself. All values are analyst choices (ASSUMPTION), explored only to test whether
# the ranking of inputs survives; none is an empirical estimate.
horizon_long_years: 40            # longer evaluation horizon
adoption_rate_k: [0.10, 0.15]     # slower diffusion; tool baseline 0.30 (economic_params.yaml);
                                  # about 1 point per year at K = 0.35 needs k near 0.11 (Alene et al. 2019)
gain_targets_pct_per_yr: [0.25, 1.0]   # calibration targets around the baseline 0.5 (sensitivity listed in economic_params.yaml)
compression_zero_mass: [0.5, 0.7]      # probability that compression is zero; remaining mass: equal on 1-3 yr
                                       # (0.5), or on 1 yr only (0.7)
seasonal_compression_years: [0, 0.5, 1]   # one bean season = half a year if the target environments have two seasons (needs source)
seasonal_time_step_years: 0.5
